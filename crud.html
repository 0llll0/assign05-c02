<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple CRUD Service - Movie Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">&larr; 목록으로</a></p>
  <h1>영화 관리 (Movie Management)</h1>

  <form id="movieForm">
    <div class="form-row">
      <label for="title">제목</label>
      <input type="text" id="title" name="title">
    </div>
    <div class="form-row">
      <label for="director">감독</label>
      <input type="text" id="director" name="director">
    </div>
    <div class="form-row">
      <label for="genre">장르</label>
      <select id="genre" name="genre">
        <option value="">-- 장르 선택 --</option>
        <option value="액션">액션</option>
        <option value="드라마">드라마</option>
        <option value="코미디">코미디</option>
        <option value="SF">SF</option>
        <option value="애니메이션">애니메이션</option>
      </select>
    </div>
    <div class="form-row">
      <label for="year">개봉년도</label>
      <input type="number" id="year" name="year">
    </div>
    <div class="form-row">
      <label for="rating">평점 (0~10)</label>
      <input type="number" id="rating" name="rating" step="0.1">
    </div>

    <button type="submit" id="submitBtn">Add</button>
  </form>

  <table id="movieTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>제목</th>
        <th>감독</th>
        <th>장르</th>
        <th>개봉년도</th>
        <th>평점</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="movieTableBody">
      <!-- render()로 채워짐 -->
    </tbody>
  </table>

  <script>
    // Database 대신 배열을 데이터 저장소로 사용한다.
    let movies = [
      { id: 1, title: "인터스텔라", director: "크리스토퍼 놀란", genre: "SF", year: 2014, rating: 9.0 },
      { id: 2, title: "기생충", director: "봉준호", genre: "드라마", year: 2019, rating: 9.2 },
      { id: 3, title: "라라랜드", director: "데이미언 셔젤", genre: "드라마", year: 2016, rating: 8.5 },
    ];

    let nextId = movies.length + 1;

    // 배열(movies)의 내용을 테이블에 다시 그려주는 함수.
    // 데이터가 바뀔 때마다(추가/수정/삭제 후) 이 함수를 다시 호출한다.
    function render() {
      const tbody = document.getElementById("movieTableBody");
      tbody.innerHTML = "";

      movies.forEach(function (movie) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + movie.id + "</td>" +
          "<td>" + movie.title + "</td>" +
          "<td>" + movie.director + "</td>" +
          "<td>" + movie.genre + "</td>" +
          "<td>" + movie.year + "</td>" +
          "<td>" + movie.rating + "</td>" +
          "<td>" +
          "<button onclick=\"startEdit(" + movie.id + ")\">수정</button> " +
          "<button class=\"del-btn\" onclick=\"deleteMovie(" + movie.id + ")\">삭제</button>" +
          "</td>";
        tbody.appendChild(tr);
      });
    }

    const form = document.getElementById("movieForm");
    const submitBtn = document.getElementById("submitBtn");

    // null이면 "추가 모드", 숫자가 들어있으면 "그 id를 수정하는 중"이라는 뜻.
    let editingId = null;

    // [수정] 버튼 클릭 시: 해당 영화를 find()로 찾아서 Form에 값을 채워준다.
    function startEdit(id) {
      const movie = movies.find(function (m) {
        return m.id === id;
      });
      if (!movie) return;

      form.title.value = movie.title;
      form.director.value = movie.director;
      form.genre.value = movie.genre;
      form.year.value = movie.year;
      form.rating.value = movie.rating;

      editingId = id;
      submitBtn.innerText = "저장";
      form.title.focus();
    }

    // [삭제] 버튼 클릭 시: confirm으로 한 번 확인한 뒤, filter()로 배열에서 제거.
    function deleteMovie(id) {
      const confirmed = confirm("삭제하시겠습니까?");
      if (!confirmed) return;

      movies = movies.filter(function (m) {
        return m.id !== id;
      });

      render();
    }

    // Form 제출 시: editingId가 있으면 수정, 없으면 추가(push).
    form.addEventListener("submit", function (e) {
      e.preventDefault(); // 기본 submit(새로고침) 막기

      const title = form.title.value.trim();
      const director = form.director.value.trim();
      const genre = form.genre.value;
      const year = form.year.value;
      const rating = form.rating.value;

      if (editingId !== null) {
        // 수정 모드: find()로 배열 안의 해당 객체를 찾아서 값만 바꿔준다.
        const movie = movies.find(function (m) {
          return m.id === editingId;
        });
        movie.title = title;
        movie.director = director;
        movie.genre = genre;
        movie.year = Number(year);
        movie.rating = Number(rating);

        editingId = null;
        submitBtn.innerText = "Add";
      } else {
        // 추가 모드
        const newMovie = {
          id: nextId,
          title: title,
          director: director,
          genre: genre,
          year: Number(year),
          rating: Number(rating),
        };
        movies.push(newMovie);
        nextId++;
      }

      render();
      form.reset();
      form.title.focus();
    });

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
